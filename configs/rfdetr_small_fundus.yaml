# RF-DETR Small — example training configuration (resolution 512, patch 16).
# Usage:
#   rfdetr fit --config configs/rfdetr_small_fundus.yaml
#   rfdetr fit --config configs/rfdetr_small_fundus.yaml \
#     --model.train_config.init_args.dataset_dir /data/my_dataset \
#     --trainer.devices 4

model:
  # ==========================================================================
  # model_config：模型本身（等同 RFDETRSmall(...) 建構子的參數）
  # ==========================================================================
  model_config:
    class_path: rfdetr.config.RFDETRSmallConfig
    init_args:
      num_classes: 80 # 資料集類別數。CLI 不會自動偵測，必填

      # ---- 權重 ----
      # pretrain_weights: rf-detr-small.pth   # 預訓練權重；只寫檔名會從 ~/.roboflow/models 讀取/下載；null = 從頭訓練

      # ---- 輸入 ----
      # resolution: 512                       # 輸入解析度，必須是 patch_size * num_windows（=32）的倍數
      #   CLI 改 resolution 時要同時設 positional_encoding_size = resolution / 16（例：800 → 50），
      #   CLI 不會自動推算（Python API 會）。
      # num_channels: 3                       # 輸入通道數

      # ---- 記憶體 / 速度 ----
      # gradient_checkpointing: false         # 重算 activation 省 30~40% 顯存，約慢 20%
      # compile: false                        # torch.compile
      # cuda_graphs: false                    # 單 GPU CUDA graph 重播（僅偵測、BF16）
      # fused_optimizer: true                 # 使用 fused AdamW
      # freeze_encoder: false                 # 凍結 backbone，只訓練其他部分
      # backbone_lora: false                  # 對 backbone 用 LoRA 微調（需 rfdetr[lora]）
      # device: cuda                          # 只影響建模；CLI 用哪張卡請用 trainer.devices 或 CUDA_VISIBLE_DEVICES

      # ---- 推論後處理 ----
      # num_select: 300                       # 後處理保留的最多偵測數

      # ---- 架構參數：使用預訓練權重時不要改，否則權重對不上 ----
      # encoder: dinov2_windowed_small
      # out_feature_indexes: [3, 6, 9, 12]
      # dec_layers: 3
      # two_stage: true
      # projector_scale: [P4]
      # hidden_dim: 256
      # patch_size: 16
      # num_windows: 2
      # sa_nheads: 8
      # ca_nheads: 16
      # dec_n_points: 2
      # dim_feedforward: 2048
      # num_queries: 300
      # group_detr: 13
      # bbox_reparam: true
      # lite_refpoint_refine: true
      # layer_norm: true
      # ia_bce_loss: true
      # positional_encoding_size: 32
      # num_decoder_registers: 0
      # postprocess_trace_alpha: 0.2

  # ==========================================================================
  # train_config：訓練參數（等同 model.train(...) 的參數）
  # ==========================================================================
  train_config:
    class_path: rfdetr.config.TrainConfig
    init_args:
      dataset_dir: /mnt/10TB_2024/Katsu/data/rf-detr/coco128
      output_dir: /mnt/10TB_2024/Katsu/Result/rf-detr/fundus_baseline
      # dataset_file: roboflow                # roboflow | coco | yolo | o365 | webdataset
      # class_names: null                     # 指定類別名稱；null = 從資料集讀
      num_workers: 4                        # DataLoader worker 數

      # ---- 訓練長度與 batch ----
      epochs: 100 # 試跑 1 個 epoch，正式訓練改成 50~100
      batch_size: 16
      grad_accum_steps: 2 # 有效 batch = batch_size * grad_accum_steps * GPU 數
      # eval_batch_size: null                 # 驗證/測試 batch；null = 跟 batch_size 一樣
      # auto_batch_target_effective: 16       # 以下三個只在 batch_size: auto 時有用（CLI 不適用）
      # auto_batch_max_targets_per_image: 100
      # auto_batch_ema_headroom: 0.7
      # resume: null                          # 接續訓練的 checkpoint 路徑（last.ckpt 會恢復 optimizer 狀態）

      # ---- 學習率與優化器 ----
      lr: 1.0e-4 # 主學習率（encoder 以外）
      # lr_encoder: 1.5e-4                    # backbone 學習率
      # lr_vit_layer_decay: 0.8               # ViT 逐層學習率衰減
      # lr_component_decay: 0.7               # 各元件學習率衰減
      # weight_decay: 1.0e-4
      # optimizer: adamw                      # torch.optim 短名稱（adamw/sgd）或完整 import 路徑
      # optimizer_kwargs: {}
      # lr_scheduler: step                    # step | cosine | 完整 import 路徑
      # lr_scheduler_kwargs: {}               # step/cosine 可設 lr_drop（預設 100）、min_factor（預設 0.0）
      # lr_scheduler_interval: step           # step | epoch（只對自訂 scheduler 有效）
      # lr_scheduler_monitor: val/loss        # 給 ReduceLROnPlateau 用
      # warmup_epochs: 0.0                    # 線性 warmup epoch 數
      # clip_max_norm: 0.1                    # 梯度裁剪；0 = 不裁剪

      # ---- 正則化與 loss ----
      # drop_path: 0.0                        # backbone stochastic depth
      # cls_loss_coef: 1.0                    # 分類 loss 權重

      # ---- 資料增強 ----
      # multi_scale: PER_BATCH                # PER_BATCH | PER_SAMPLE | 'OFF'（CLI 要寫大寫名稱；OFF 必須加引號，否則 YAML 會讀成 false）
      # expanded_scales: true                 # 多尺度訓練用較廣的尺度範圍
      # scale_jitter: true
      # square_resize_div_64: true
      # augmentation_backend: cpu             # cpu | auto | gpu | torchvision
      # aug_config: null                      # 自訂 Albumentations/Kornia 設定（需 rfdetr[augment]）
      # save_dataset_grids: false             # 存下增強後的樣本網格圖，方便檢查

      # ---- 精度 ----
      # amp_dtype: auto                       # auto | bf16 | fp16 | fp8 | null（null = 全 fp32）

      # ---- EMA ----
      # use_ema: true
      # ema_decay: 0.993
      # ema_tau: 100
      # ema_update_interval: 1

      # ---- Checkpoint 與最佳模型 ----
      # checkpoint_interval: 10               # 每 N 個 epoch 存一次 checkpoint_<epoch>.ckpt
      # best_model_metric: map                # map | mar
      # skip_best_epochs: 0                   # 前 N 個 epoch 不參與最佳模型 / early stopping 判斷
      # smooth_alpha: 0.0                     # 選最佳模型時對指標做 EMA 平滑，範圍 [0, 1)
      # dont_save_weights: false

      # ---- Early stopping ----
      # early_stopping: false
      # early_stopping_patience: 10
      # early_stopping_min_delta: 0.001
      # early_stopping_use_ema: false

      # ---- 驗證 / 測試 ----
      # eval_interval: 1                      # 每 N 個 epoch 驗證一次（最後一個 epoch 一定驗證）
      # eval_max_dets: 500
      # eval_backend: vernier                 # vernier | hotcoco | hotcoco_streaming | faster_coco_eval | ufcoco
      # eval_base_model: false                # 除了 EMA 也評估原始權重
      log_per_class_metrics: true          # 輸出每個類別的 AP
      # run_test: false                       # 訓練結束後跑 test split
      compute_val_loss: true                # auto | true | false
      # compute_test_loss: true
      # num_sanity_val_steps: 0               # 開訓前先跑幾個驗證 batch 檢查
      # eval_masks_head_resolution: false     # 分割專用

      # ---- 記錄 ----
      progress_bar: rich                   # tqdm | rich | null
      # tensorboard: true                     # 需 pip install tensorboard
      # wandb: false
      # mlflow: false
      # clearml: false                        # 尚未實作
      # project: null                         # W&B 專案名稱
      # run: null                             # W&B run 名稱
      # notes: null                           # 寫進 checkpoint 的自訂備註
      # train_log_on_step: false
      # train_log_sync_dist: false
      # compact_train_metrics: true
      # compute_train_metrics: false

      # ---- 硬體 / 分散式 ----
      # accelerator: auto                     # auto | gpu | cpu | mps
      # devices: 1                            # GPU 數；也可用 trainer.devices 覆蓋
      # strategy: auto                        # auto | ddp | fsdp ...
      # num_nodes: 1
      # sync_bn: false
      # seed: null                            # 固定亂數種子

      # ---- DataLoader 調校 ----
      # pin_memory: null
      # persistent_workers: null
      # prefetch_factor: null
      # pack_targets: true
      # pad_targets_to: null                  # TPU/XLA 用

# ============================================================================
# trainer：直接覆蓋 PyTorch Lightning Trainer 的設定（可選）
# 大部分已由 train_config 決定；改 epoch 請用 train_config.epochs，不要用 max_epochs
# ============================================================================
# trainer:
#   devices: 1
#   callbacks: []
